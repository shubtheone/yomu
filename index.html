<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yomu - 読む</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#fdf6e3">
    <meta name="description" content="Offline-first Japanese reader with library">
    <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
    <div id="app">
        <header>
            <button id="back-btn" class="nav-btn hidden" aria-label="Back to Library">←</button>
            <h1 id="header-title">Yomu Library</h1>
            <button id="toggle-mode" class="nav-btn hidden" aria-label="Toggle Layout">⟲</button>
        </header>
        
        <main id="library-view" class="view-container">
            <div id="library-list">
                <!-- Stories will be injected here -->
                <p class="loading">Loading library...</p>
            </div>
        </main>

        <main id="reader-view" class="view-container hidden vertical-text">
            <div id="reader-content">
                <!-- Story content will be injected here -->
            </div>
        </main>
        
        <!-- Definition Popup -->
        <div id="definition-popup" class="hidden">
            <div class="popup-content">
                <h3 id="popup-word"></h3>
                <p id="popup-reading"></p>
                <hr>
                <p id="popup-meaning">Meaning...</p>
                <button id="close-popup">Close</button>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('SW registered!', reg))
                .catch(err => console.log('SW failed', err));
        }
    </script>
</body>
</html>
